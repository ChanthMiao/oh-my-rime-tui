[package]
name = "oh-my-rime-tui"
version = "3.0.0"
edition = "2021"
description = "A TUI/CLI tool for managing Rime input method configuration"
authors = ["Mintimate"]
license = "MIT"

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

clap = { version = "4", features = ["derive"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["stream"] }

zip = "2"
flate2 = "1"
tar = "0.4"

futures-util = "0.3"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[features]
default = ["tui"]
tui = ["ratatui", "crossterm"]

[[bin]]
name = "oh-my-rime-tui"
path = "src/main.rs"
